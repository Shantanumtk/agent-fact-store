[project]
name = "agent-fact-store"
version = "0.1.0"
description = "A universal, provenance-first fact store for AI agents"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest", "mcp>=2.3,<3"]

[project.scripts]
agent-fact-store-mcp = "agent_fact_store.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_fact_store = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
